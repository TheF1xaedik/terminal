<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>root@kali-nfc: ~</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Courier New', 'Lucida Console', Monaco, monospace;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #0c0c0c;
    --fg: #cccccc;
    --green: #00ff66;
    --blue: #3b8eea;
    --red: #e06c75;
    --yellow: #e5c07b;
    --cyan: #56b6c2;
    --dim: #5c6370;
  }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background-color: var(--bg);
    color: var(--fg);
    overflow: hidden;
  }

  /* ─── Экран инициализации и выбора роли ─── */
  #initOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
  }

  .boot-box {
    border: 1px solid #333;
    background: #050505;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 0 20px rgba(0,255,102,0.1);
  }

  .boot-title {
    color: var(--green);
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 15px;
    border-bottom: 1px dashed #333;
    padding-bottom: 8px;
  }

  .btn-select {
    display: block;
    width: 100%;
    background: #111;
    color: var(--green);
    border: 1px solid var(--green);
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 0;
    text-align: left;
    transition: 0.2s;
  }
  .btn-select:hover, .btn-select:active {
    background: var(--green);
    color: #000;
  }

  /* ─── Настоящее окно TTY ─── */
  #terminal {
    width: 100%;
    height: 100%;
    padding: 10px 14px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-all;
    white-space: pre-wrap;
    cursor: text;
  }

  /* Цвета в стиле Linux */
  .c-green  { color: var(--green); }
  .c-blue   { color: var(--blue); font-weight: bold; }
  .c-red    { color: var(--red); }
  .c-yellow { color: var(--yellow); }
  .c-cyan   { color: var(--cyan); }
  .c-dim    { color: var(--dim); }
  .bold     { font-weight: bold; }

  /* Строка ввода */
  .input-row {
    display: flex;
    align-items: center;
    position: relative;
    width: 100%;
  }

  .prompt-label {
    flex-shrink: 0;
    user-select: none;
  }

  #realInput {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: text;
    font-size: 16px; /* Предотвращает зум на мобильных */
  }

  .fake-input {
    flex: 1;
    color: #fff;
    min-height: 1.2em;
    display: flex;
    align-items: center;
    word-break: break-all;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background-color: var(--fg);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1s infinite steps(1);
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* Быстрая строка на телефонах */
  #mobileBar {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #111;
    border-top: 1px solid #222;
    padding: 6px;
    gap: 6px;
    overflow-x: auto;
  }
